<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Micro-Dump 数据包分析流程</title>
  <desc id="desc">Live AF_PACKET capture or offline PCAP flows through decoding and filters into the terminal interface or plain output, with payload bytes excluded.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1728"/><stop offset="1" stop-color="#132a42"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54dfbd"/><stop offset="1" stop-color="#46aefa"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6b9cba"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="22" fill="url(#canvas)" stroke="#29445f" stroke-width="2"/>
  <text x="32" y="39" fill="#e8f2fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">PACKET INSPECTION PIPELINE</text>
  <text x="928" y="39" fill="#87a7c2" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">HEADER ONLY</text>
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="76" width="196" height="116" rx="13" fill="#12243a" stroke="#345570" stroke-width="1.5"/>
    <text x="48" y="103" fill="#62e6c5" font-size="12" font-weight="700">01 / INPUT</text>
    <text x="48" y="130" fill="#edf6ff" font-size="16" font-weight="650">数据来源</text>
    <text x="48" y="153" fill="#a9c0d3" font-size="12">AF_PACKET 实时捕获</text>
    <text x="48" y="172" fill="#a9c0d3" font-size="12">经典 Ethernet PCAP</text>
    <path d="M229 134h29" stroke="#6b9cba" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="266" y="76" width="196" height="116" rx="13" fill="#12243a" stroke="#345570" stroke-width="1.5"/>
    <text x="284" y="103" fill="#62e6c5" font-size="12" font-weight="700">02 / DECODE</text>
    <text x="284" y="130" fill="#edf6ff" font-size="16" font-weight="650">协议头解析</text>
    <text x="284" y="153" fill="#a9c0d3" font-size="12">Ethernet · IP · TCP/UDP</text>
    <text x="284" y="172" fill="#a9c0d3" font-size="12">长度检查 · 可选校验和</text>
    <path d="M465 134h29" stroke="#6b9cba" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="502" y="76" width="196" height="116" rx="13" fill="#12243a" stroke="#345570" stroke-width="1.5"/>
    <text x="520" y="103" fill="#62e6c5" font-size="12" font-weight="700">03 / FILTER</text>
    <text x="520" y="130" fill="#edf6ff" font-size="16" font-weight="650">组合过滤</text>
    <text x="520" y="153" fill="#a9c0d3" font-size="12">端口 · IP/CIDR · 协议</text>
    <text x="520" y="172" fill="#a9c0d3" font-size="12">所有过滤条件同时生效</text>
    <path d="M701 134h29" stroke="#6b9cba" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="738" y="76" width="192" height="116" rx="13" fill="#12243a" stroke="#3a8c88" stroke-width="1.5"/>
    <text x="756" y="103" fill="#62e6c5" font-size="12" font-weight="700">04 / OUTPUT</text>
    <text x="756" y="130" fill="#edf6ff" font-size="16" font-weight="650">终端呈现</text>
    <text x="756" y="153" fill="#a9c0d3" font-size="12">交互式 TUI / 纯文本</text>
    <text x="756" y="172" fill="#a9c0d3" font-size="12">有界历史 · TCP 标志着色</text>
    <rect x="30" y="220" width="900" height="48" rx="10" fill="#0b1a29" stroke="#28485d"/>
    <circle cx="52" cy="244" r="5" fill="#62e6c5"/>
    <text x="68" y="249" fill="url(#mint)" font-size="13" font-weight="700">安全边界</text>
    <text x="160" y="249" fill="#b6cad9" font-size="13">只展示协议头元数据；数据包载荷不会被显示、保存或记录。</text>
  </g>
</svg>
